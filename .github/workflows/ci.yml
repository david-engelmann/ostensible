name: CI

on:
  push:
  pull_request:
  merge_group:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Rust tests
        run: cargo test
      - name: Check the Rust formatting
        run: cargo fmt --check
      - name: Run the Rust lints
        run: cargo clippy --all-targets
